# YouTube Shorts Maker 설정 예시.
#
# 이 파일을 config.yaml로 복사한 뒤 바꿀 키만 남기면 된다. 빠뜨린 키는 기본값을 쓰고,
# 여기 없는 키를 쓰면 실행 시작 시점에 "알 수 없는 설정 키" 오류가 난다.
# 우선순위: CLI 오버라이드 > config.yaml > 기본값
#
# 아래 값은 전부 기본값이므로, 그대로 두고 실행해도 결과가 달라지지 않는다.

llm:
  generator:
    provider: claude_cli          # 콘텐츠 생성 provider (현재 claude_cli만 등록돼 있다)
    model: opus                   # 생성 모델. claude CLI 별칭 또는 전체 모델 ID
  verifier:
    provider: claude_cli          # 검증 provider. 생성과 다른 vendor로 바꿀 수 있다
    model: opus                   # 검증 모델. 생성과 같으면 블라인드 검증력이 구조적으로 약해진다
    runs: 2                       # 블라인드 재답변 호출 횟수 (1 이상. 문제 수와 무관하다)
    confidence_threshold: 0.8     # 미만이면 flagged. 같은 값은 통과. 의미 있는 범위는 0.5~0.98
  timeout_sec: 600                # LLM 호출 1회 타임아웃(초)
  max_retries: 2                  # 재시도 횟수. 타임아웃·바이너리 부재는 재시도하지 않는다
  providers:
    claude_cli:
      binary: claude              # 실행할 claude CLI 바이너리 이름 또는 절대 경로

tts:
  provider: edge_tts              # 음성 합성 provider (현재 edge_tts만 등록돼 있다)
  voice: ko-KR-SunHiNeural        # provider가 쓰는 음성 이름을 그대로 넘긴다
  timeout_sec: 60                 # 문장 1개 합성 타임아웃(초). 넘기면 재시도하지 않는다
  max_retries: 2                  # 재시도 횟수. 타임아웃·모듈 부재는 재시도하지 않는다
  cache_dir: .cache/tts           # 세그먼트 캐시 위치. run 디렉터리 밖이다. null이면 캐시를 끈다

# 낭독 장면의 길이 확정 공식 (PRD 7.5.1)
#   duration = max(lead_in_sec + 실측_오디오_길이 + tail_sec, min_duration_sec)
timing:
  lead_in_sec: 0.3                # 장면 시작부터 낭독이 시작되기까지의 여백(초)
  tail_sec: 0.5                   # 낭독이 끝난 뒤 컷까지의 여백(초)
  min_duration_sec: 1.2           # 낭독이 짧아도 이보다 짧은 장면은 만들지 않는다(초)

quiz:
  question_count: 4               # 한 영상에 담을 문제 수 (3~5. 벗어나면 실행 시작 시점에 오류)
  countdown_sec: 4                # 카운트다운 장면 기본 길이(초)
  answer_max_len: 20              # 정답 글자 수 상한. 넘으면 생성 실패로 멈춘다
  explanation_max_len: 60         # 한 줄 해설 글자 수 상한. 정답 장면 자막에 들어간다

# 업로드 시 붙여넣을 제목·설명·태그 (PRD 7.8). 상한은 YouTube의 하드 리밋이 아니라 운영
# 기준이다 — 제목 100자는 허용되지만 모바일 검색 결과에서 잘린다.
metadata:
  title_max_len: 40               # 제목 후보 1개의 글자 수 상한. 넘으면 생성 실패로 멈춘다
  tag_max_count: 10               # 태그 개수 상한. 1개 이상이어야 한다

render:
  font_path: null                 # 자막·오버레이 폰트 경로. null이면 번들 폰트를 찾는다
  background: gradient_default    # 배경 프리셋 이름
