# YouTube Shorts Maker 설정 예시.
#
# 이 파일을 config.yaml로 복사한 뒤 바꿀 키만 남기면 된다. 빠뜨린 키는 기본값을 쓰고,
# 여기 없는 키를 쓰면 실행 시작 시점에 "알 수 없는 설정 키" 오류가 난다.
# 우선순위: CLI 오버라이드 > config.yaml > 기본값
#
# 아래 값은 전부 기본값이므로, 그대로 두고 실행해도 결과가 달라지지 않는다.

llm:
  generator:
    provider: claude_cli          # 콘텐츠 생성 provider (현재 claude_cli만 등록돼 있다)
    model: opus                   # 생성 모델. claude CLI 별칭 또는 전체 모델 ID
  verifier:
    provider: claude_cli          # 검증 provider. 생성과 다른 vendor로 바꿀 수 있다
    model: opus                   # 검증 모델. 생성과 같으면 블라인드 검증력이 구조적으로 약해진다
    runs: 2                       # 블라인드 재답변 호출 횟수 (1 이상. 문제 수와 무관하다)
    confidence_threshold: 0.8     # 미만이면 flagged. 같은 값은 통과. 의미 있는 범위는 0.5~0.98
  timeout_sec: 600                # LLM 호출 1회 타임아웃(초)
  max_retries: 2                  # 재시도 횟수. 타임아웃·바이너리 부재는 재시도하지 않는다
  providers:
    claude_cli:
      binary: claude              # 실행할 claude CLI 바이너리 이름 또는 절대 경로

tts:
  provider: edge_tts              # 음성 합성 provider (현재 edge_tts만 등록돼 있다)
  voice: ko-KR-SunHiNeural        # provider가 쓰는 음성 이름을 그대로 넘긴다
  timeout_sec: 60                 # 문장 1개 합성 타임아웃(초). 넘기면 재시도하지 않는다
  max_retries: 2                  # 재시도 횟수. 타임아웃·모듈 부재는 재시도하지 않는다
  cache_dir: .cache/tts           # 세그먼트 캐시 위치. run 디렉터리 밖이다. null이면 캐시를 끈다

# 원문 입력 (PRD 7.1). --text-file / --url 실행만 읽는다. 상한을 넘기면 run 디렉터리를
# 만들기 전에 멈추고, 통과한 원문은 전문이 source.json에 남는다.
source:
  max_chars: 200000               # 원문 글자 수 상한. 넘으면 실행 시작 시점에 오류
  title_max_len: 80               # 첫 줄에서 제목을 딸 때의 상한. 넘는 줄은 잘라 쓴다
  # 링크 입력(--url)만 읽는다. 거부는 HTTP 상태·Content-Type·본문 길이 셋으로만 걸고
  # 페이지 유형을 판별하지 않는다 (PRD 14.1).
  url:
    timeout_sec: 20               # 페이지 하나를 가져오는 타임아웃(초)
    max_bytes: 5000000            # 응답 본문 상한(바이트). 넘으면 읽다가 멈춘다
    max_redirects: 5              # 따라갈 리다이렉트 수 상한
    min_chars: 300                # 추출된 본문의 하한. 미만이면 --text-file로 안내한다

# 낭독 장면의 길이 확정 공식 (PRD 7.5.1)
#   duration = max(lead_in_sec + 실측_오디오_길이 + tail_sec,
#                  min_duration_sec,
#                  caption_onset_sec + 자막_글자수 / reading_cps + tail_sec)  # caption이 있을 때
timing:
  lead_in_sec: 0.3                # 장면 시작부터 낭독이 시작되기까지의 여백(초)
  tail_sec: 0.5                   # 낭독이 끝난 뒤 컷까지의 여백(초)
  min_duration_sec: 1.2           # 낭독이 짧아도 이보다 짧은 장면은 만들지 않는다(초)
  caption_onset_sec: 0.9          # 화면에 자막이 뜨는 시각(초). 렌더러(#22)와 같은 값을 읽는다
  reading_cps: 12.0               # 자막의 초당 읽기 글자 수. 0보다 커야 한다

# 트랙 레벨 (PRD 7.7). 번들 효과음은 낭독보다 peak 9.5dB 아래로 정규화돼 있어 기본값에서
# 추가 감쇠가 필요하지 않다. 올려도 최종 오디오는 -1 dBFS에서 리미터가 잡는다.
audio:
  sfx_volume: 1.0                 # 효과음 선형 게인. 0이면 효과음 없이 렌더한다. 음수는 오류
  voice_volume: 1.0               # 낭독 선형 게인. 1.0이 원본 레벨, 0이면 낭독이 들리지 않는다

# captions.srt의 줄바꿈 (PRD 7.6). 자막 번인(#20)의 줄바꿈과 다른 층이다 — 번인은 요소별
# 폰트 크기에서 줄당 글자 수를 계산하고, 여기 값은 외부 재생기가 여는 SRT 트랙의 것이다.
captions:
  max_chars_per_line: 18          # 한 줄 글자 수 상한. 어절 단위로 접고, 넘는 어절만 자른다
  max_lines: 4                    # 큐 하나의 줄 수 상한. 넘으면 경고만 하고 내용은 자르지 않는다

quiz:
  question_count: 4               # 한 영상에 담을 문제 수 (3~5. 벗어나면 실행 시작 시점에 오류)
  countdown_sec: 3                # 카운트다운 장면 기본 길이(초). 4로 올리면 4 → 1을 센다
  # 생성 텍스트의 글자 수 상한. 전부 D1 확정 스펙의 레이아웃 티어 하한이고, 넘으면 화면
  # 안전 영역을 벗어난다. 렌더에서 자르지 않고 생성 단계에서 멈춘다 — 잘린 문장은 화면에서
  # 말이 안 되고 사람이 검수할 원문도 사라진다. 올리려면 렌더 티어(#20)도 함께 봐야 한다.
  hook_max_len: 36                # 후킹 문구. 64px 3줄 (확정 스펙 5.1)
  question_max_len: 45            # 질문. 56px 3줄 (5.2)
  answer_max_len: 20              # 정답. 2줄까지 (5.4)
  cta_max_len: 24                 # CTA 첫 줄. 68px 2줄 (5.5). punch·tail은 render 섹션에 있다
  explanation_max_len: 60         # 한 줄 해설. 정답 장면 자막에 들어간다 (5.4)

# 업로드 시 붙여넣을 제목·설명·태그 (PRD 7.8). 상한은 YouTube의 하드 리밋이 아니라 운영
# 기준이다 — 제목 100자는 허용되지만 모바일 검색 결과에서 잘린다.
metadata:
  title_max_len: 40               # 제목 후보 1개의 글자 수 상한. 넘으면 생성 실패로 멈춘다
  tag_max_count: 10               # 태그 개수 상한. 1개 이상이어야 한다

render:
  font_path: null                 # 자막·오버레이 폰트 경로. null이면 번들 폰트(assets/fonts/)를 쓴다
  # 프리셋 이름은 assets/의 presets.json이 정한다. 없는 이름을 쓰면 쓸 수 있는 이름을 나열한다.
  background: deep_navy           # 배경. deep_navy / purple_gradient / deep_teal_gradient
  caption_style: impact_yellow    # 자막 색 프리셋. impact_yellow / neon_mint / orange_card
  # CTA 화면의 고정 두 줄 (D1 확정 스펙 5.5). 채널 브랜딩이라 LLM이 짓지 않는다.
  cta_punch: "구독 · 좋아요"      # CTA 강조 줄. 1줄 9자까지
  cta_tail: "매일 새 상식 퀴즈"    # CTA 마지막 줄. 1줄 21자까지
