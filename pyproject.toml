[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-shorts-maker"
version = "0.1.0"
description = "세로형 쇼츠 자동 생성 엔진"
readme = "README.md"
requires-python = ">=3.11"

# 렌더러가 FFmpeg 호출 도구를(#19) 추가한다.
dependencies = [
    "pyyaml>=6.0",  # config.yaml 파싱 (#6)
    # 기본 TTS provider (#14). 비공식 엔드포인트를 쓰므로 예고 없이 깨질 수 있다 —
    # 승격 경로는 스파이크 #2 5.2에 있다. 하한은 실측에 쓴 버전이다.
    "edge-tts>=7.2.8",
]

[project.optional-dependencies]
# fonttools는 번들 폰트 검사 전용이다 (#38) — 웨이트·임베딩 허용 비트·한글 커버리지를
# 커밋된 파일에서 다시 재는 데 쓴다. 파이프라인은 폰트를 파싱하지 않으므로 런타임 의존이
# 아니고, 손으로 cmap을 파싱하는 코드를 테스트에 두지 않기 위한 선택이다.
dev = ["pytest>=8.0", "fonttools>=4.50"]

[project.scripts]
shorts-maker = "shorts_maker.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 설치하지 않은 상태에서도 tests가 src/를 import할 수 있게 한다.
pythonpath = ["src"]
