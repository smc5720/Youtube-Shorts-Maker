[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-shorts-maker"
version = "0.1.0"
description = "세로형 쇼츠 자동 생성 엔진"
readme = "README.md"
requires-python = ">=3.11"

# TTS provider가 합성 라이브러리를(#14), 렌더러가 FFmpeg 호출 도구를(#19) 추가한다.
dependencies = [
    "pyyaml>=6.0",  # config.yaml 파싱 (#6)
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
shorts-maker = "shorts_maker.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 설치하지 않은 상태에서도 tests가 src/를 import할 수 있게 한다.
pythonpath = ["src"]
